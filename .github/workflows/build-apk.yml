name: Build debug APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Pick newest uploaded zip
        run: |
          ZIP="$(git log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -v '^$' | head -1)"
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then ZIP="$(ls ./*.zip | head -1)"; fi
          echo "Using zip: $ZIP"
          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"
      - name: Build
        run: |
          unzip -q "$ZIP_FILE" -d proj
          cd "$(dirname "$(find proj -name package.json -not -path '*/node_modules/*' | head -1)")"
          npm install
          npx cap add android
          npm run assets
          npm run sync
          f=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $f || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n</manifest>#' $f
          grep -q RECEIVE_BOOT_COMPLETED $f || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n</manifest>#' $f
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 90days-track-debug-apk
          path: proj/**/app-debug.apk
